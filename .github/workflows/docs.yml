# The documentation site: every language in HTML and PDF, made by
# docs/build.sh (the same script as on a local machine). It is built and
# checked on every push and pull request; it is published to GitHub Pages only
# from main (Settings > Pages > Source: GitHub Actions).
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # WeasyPrint (the PDF) needs Pango; the Python tools are pinned in docs/requirements.txt
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pip install --quiet -r docs/requirements.txt

      # strict: a broken link or anchor, a translation that lost a heading, a
      # code block or a link, or a missing PDF fails the build
      - name: Build
        run: sh docs/build.sh

      - name: The PDFs, to download from this run
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: site/*/pdf/*.pdf

      - name: The site, for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
