    received_help: "Pokud je zapnuto, getmail přidá ke zprávě hlavičku Received:. Pokud je vypnuto, nepřidá ji. Výchozí: zapnuto."
    syslog: Logovat do syslogu
    syslog_help: "Pokud je zapnuto, getmail zaznamenává svou činnost do systémového logu. Syslog je ze své podstaty nespolehlivý a může zprávy ztrácet. Výchozí: vypnuto."
    max_messages: Max. počet zpráv na běh
    max_messages_help: Pokud je nastaveno, getmail stáhne při jednom běhu nejvýše tolik zpráv. Hodí se pro první import velké schránky. Ponechte prázdné bez omezení.
    max_bytes: Max. bajtů na běh
    max_bytes_help: Pokud je nastaveno, getmail přestane stahovat po tolika bajtech v jednom běhu. Hodí se pro první import velké schránky. Ponechte prázdné bez omezení.
    unlimited: bez omezení
    delete_bigger: Mazat zprávy větší než (bajty)
    delete_bigger_help: Pokud je nastaveno, getmail smaže na vzdáleném serveru zprávy větší než tato velikost, ANIŽ by je stáhl. Ponechte prázdné pro vypnutí.
