    delete_help: "Pokud je zapnuto, getmail zprávy po stažení a úspěšném doručení smaže. Pokud je vypnuto, nechá je na serveru. Výchozí: vypnuto."
    delete_after: Mazat zprávy po
    delete_after_help: "Pokud je nastaveno, getmail smaže zprávy tolik dní poté, co je poprvé uviděl, pokud byly staženy a doručeny. Zprávy tak zůstanou na serveru zvolený počet dní. Volba „Mazat zprávy“ má přednost: pokud jsou zapnuty obě, zprávy se smažou hned. Výchozí: 0, tedy funkce vypnuta."
