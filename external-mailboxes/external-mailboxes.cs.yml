    cleanup_spam_help: Pravidelně vyprazdňuje vzdálenou složku Spam (zprávy se smažou na vzdáleném serveru, ANIŽ by se importovaly). Pokud je složka uvedena i ve „Vzdálených složkách“, volba „Smazat ihned“ se automaticky prodlouží na 1 den, aby se zprávy před smazáním vždy importovaly.
    spam_folder: Název složky Spam
