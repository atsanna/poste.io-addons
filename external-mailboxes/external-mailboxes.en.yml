    password: Password
    password_help: Leave empty to keep the current password.
    mailboxes: Remote folders (IMAP only)
    mailboxes_help: Comma-separated IMAP folders to download. Use the "Load folders from server" button to pick them.
    deliver_to: Deliver messages to
    check_every: Check this account every
    schedule_disabled: disabled
    read_all: Read all
    read_all_help: "If set, getmail retrieves every message on the server, also the ones it has already fetched: it can be set only together with \"Delete message\", otherwise the messages left on the server would be fetched again at every run. If unset, getmail only retrieves messages it has not seen before. Default: False."
    delete: Delete message
    delete_help: "If set, getmail will delete messages after retrieving and successfully delivering them. If unset, getmail will leave messages on the server after retrieving them. Default: False."
    delete_after: Delete message after
    delete_after_help: "If set, getmail will delete messages this number of days after first seeing them, if they have been retrieved and delivered. This, in effect, leaves messages on the server for a configurable number of days after retrieving them. Note that the delete parameter has higher priority; if both are set, the messages will be deleted immediately. Default: 0, which means not to enable this feature."
    delete_after_never: Never
    delete_after_immediately: Immediately
    delete_after_1d: After 1 day
    delete_after_2d: After 2 days
    delete_after_3d: After 3 days
    delete_after_1w: After 1 week
    delete_after_1m: After 1 month
    delete_after_3m: After 3 months
    delete_after_1y: After 1 year
    received: Received
    received_help: "If set, getmail adds a Received: header field to the message. If unset, it will not do so. Default: True."
    syslog: Message Log Syslog
    syslog_help: "If set, getmail will record a log of its actions using the system logger. Note that syslog is inherently unreliable and can lose log messages. Default: False."
    max_messages: Max messages per session
    max_messages_help: If set, getmail retrieves at most this many messages per run. Useful for the first import of a huge mailbox. Leave empty for no limit.
    max_bytes: Max bytes per session
    max_bytes_help: If set, getmail stops retrieving after this many bytes in a single run. Useful for the first import of a huge mailbox. Leave empty for no limit.
    unlimited: unlimited
    delete_bigger: Delete messages bigger than (bytes)
    delete_bigger_help: If set, getmail deletes messages larger than this size on the remote server WITHOUT retrieving them. Leave empty to disable.
    delete_bigger_placeholder: disabled
    cleanup_trash: Empty remote Trash (IMAP only)
    cleanup_trash_help: Periodically empty the remote Trash folder (messages are deleted on the remote server WITHOUT being imported).
    trash_folder: Trash folder name
    cleanup_spam: Empty remote Spam (IMAP only)
    cleanup_spam_help: 'Periodically empty the remote Spam folder (messages are deleted on the remote server WITHOUT being imported). If the folder is also listed in "Remote folders", "Delete immediately" is automatically raised to 1 day so messages are always imported before deletion.'
    spam_folder: Spam folder name
    retention: Cleanup retention
    retention_help: How long messages are kept in the remote Trash/Spam folders before deletion.
    retention_immediately: Delete immediately
    retention_1d: Keep 1 day
    retention_3d: Keep 3 days
    retention_1w: Keep 1 week
    retention_2w: Keep 2 weeks
    retention_1m: Keep 1 month
